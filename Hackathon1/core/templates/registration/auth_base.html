<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Brightloop account{% endblock %}</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#f2effb,#f7f8fc);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202338;padding:20px}.auth-card{width:min(100%,460px);padding:34px;background:#fff;border:1px solid #e8e7ef;border-radius:17px;box-shadow:0 18px 55px #30265312}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:800;margin-bottom:27px}.brand span{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#6848b8;color:white}.auth-card h1{font-size:25px;letter-spacing:-.7px;margin:0}.subtitle{color:#76798b;font-size:13px;margin:7px 0 23px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:750}.field input{width:100%;border:1px solid #dedfe8;border-radius:8px;padding:11px 12px;font:inherit}.field input:focus{outline:3px solid #6c4bc11b;border-color:#6c4bc1}.help{color:#777b8e;font-size:11px;margin:5px 0 12px}.errorlist{padding:0;list-style:none;color:#b63e49;font-size:11px;margin:0}.button{width:100%;border:0;border-radius:8px;padding:12px;background:#6c4bc1;color:white;font-weight:800;cursor:pointer;font:inherit}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:12px}.links a{color:#6848b8;text-decoration:none}.message{padding:10px 12px;background:#e5f6ef;color:#147a5a;border-radius:7px;font-size:12px;margin-bottom:13px}</style></head><body><main class="auth-card"><div class="brand"><span>B</span>Brightloop</div>{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}{% block body %}{% endblock %}</main></body></html>
